<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeoBattle - آرنا رقابت فکری</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Vazirmatn', 'sans-serif'] } } } }
    </script>
    <style>
        body { background: #0f172a; color: #e2e8f0; font-family: 'Vazirmatn', sans-serif; margin: 0; min-height: 100vh; }
        .glass { background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(10px); border: 1px solid rgba(99, 102, 241, 0.3); }
        .btn-brand { background: #6366f1; transition: 0.2s; color: #fff; border: none; cursor: pointer; }
        .btn-brand:hover { background: #4f46e5; box-shadow: 0 0 15px rgba(99, 102, 241, 0.5); }
        .btn-danger { background: #ef4444; transition: 0.2s; color: #fff; border: none; cursor: pointer; }
        .btn-danger:hover { background: #dc2626; }
        input, select { background: #1e293b; border: 1px solid #334155; color: #fff; padding: 0.75rem; border-radius: 0.5rem; width: 100%; }
        input:focus { outline: none; border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2); }
        
        @keyframes pulse-ring { 0% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.7); } 70% { box-shadow: 0 0 0 20px rgba(99, 102, 241, 0); } 100% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0); } }
        .pulse-ring { animation: pulse-ring 1.5s infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .animate-spin { animation: spin 1s linear infinite; }
        
        .rank-bronze { color: #d97706; } .rank-silver { color: #94a3b8; } .rank-gold { color: #fbbf24; } .rank-diamond { color: #60a5fa; }
        
        .game-card { transition: 0.3s; }
        .game-card:hover { transform: translateY(-5px); border-color: #6366f1 !important; box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.2); }
        .ttt-cell { transition: 0.2s; }
        .ttt-cell:hover { background: #334155; }
        
        #app { display: none; }
        #lobby-modal { display: none; }
        #match-modal { display: none; }
        #auth-modal { display: flex; }
    </style>
</head>
<body>

<div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 z-[100] hidden glass px-6 py-3 rounded-lg text-sm font-medium border-indigo-500"></div>

<div id="auth-modal" class="fixed inset-0 z-50 items-center justify-center p-4 bg-black/80">
    <div class="glass p-8 w-full max-w-md rounded-2xl text-center">
        <div class="w-16 h-16 mx-auto bg-indigo-600 rounded-2xl flex items-center justify-center text-3xl font-bold mb-4">N</div>
        <h2 class="text-2xl font-bold mb-2">ورود به نئو بَتِل</h2>
        <p class="text-slate-400 text-sm mb-6">آرنا مسابقات فکری</p>
        <div class="space-y-4 text-right">
            <div><label class="text-xs text-slate-400 block mb-1">نام کاربری</label><input id="auth-username" type="text" placeholder="Username..."></div>
            <div><label class="text-xs text-slate-400 block mb-1">رمز عبور</label><input id="auth-password" type="password" placeholder="Password..." onkeydown="if(event.key==='Enter')doAuth()"></div>
            <button onclick="doAuth()" class="w-full btn-brand py-3 rounded-lg font-bold">ورود / ثبت‌نام</button>
        </div>
    </div>
</div>

<div id="lobby-modal" class="fixed inset-0 z-40 items-center justify-center p-4 bg-black/90">
    <div class="glass p-8 w-full max-w-md rounded-2xl text-center">
        <div class="w-20 h-20 mx-auto rounded-full bg-indigo-600 flex items-center justify-center mb-6 pulse-ring">
            <i data-lucide="loader" class="w-10 h-10 animate-spin"></i>
        </div>
        <h3 class="text-xl font-bold mb-2">در جستجوی حریف...</h3>
        <p id="lobby-info" class="text-slate-400 mb-6"></p>
        <button onclick="cancelMatchmaking()" class="btn-danger px-6 py-2 rounded-lg font-bold">لغو جستجو</button>
    </div>
</div>

<div id="match-modal" class="fixed inset-0 z-40 items-center justify-center p-4 bg-black/95">
    <div class="glass p-6 w-full max-w-3xl rounded-2xl">
        <div class="flex justify-between items-center mb-6 border-b border-slate-700 pb-4">
            <div class="text-center">
                <div class="text-xs text-slate-400">شما</div>
                <div class="text-2xl font-bold text-emerald-400" id="m-score">0</div>
            </div>
            <div class="text-center">
                <h2 id="m-title" class="text-xl font-bold">نبرد</h2>
                <div class="text-xs text-slate-500" id="m-subtitle">در حال بازی...</div>
            </div>
            <div class="text-center">
                <div class="text-xs text-slate-400">حریف</div>
                <div class="text-2xl font-bold text-rose-400" id="m-enemy-score">0</div>
            </div>
        </div>
        <div id="m-content" class="min-h-[250px] flex flex-col items-center justify-center text-center"></div>
        <div class="mt-6 text-center">
            <button onclick="leaveMatch()" class="text-slate-400 hover:text-red-400 text-sm">ترک بازی (تسلیم شدن)</button>
        </div>
    </div>
</div>

<div id="app" class="max-w-6xl mx-auto p-4 pb-20">
    <nav class="flex justify-between items-center mb-8 glass p-4 rounded-2xl sticky top-4 z-30">
        <div class="flex items-center gap-3 cursor-pointer" onclick="navigate('home')">
            <div class="w-10 h-10 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-xl flex items-center justify-center font-bold text-lg">N</div>
            <span class="font-bold text-xl hidden sm:block">NeoBattle</span>
        </div>
        <div class="flex items-center gap-4 sm:gap-6">
            <div class="flex items-center gap-2 text-amber-400 font-bold">
                <i data-lucide="trophy" class="w-5 h-5"></i>
                <span id="nav-elo">0</span>
            </div>
            <button onclick="navigate('home')" class="text-sm text-slate-300 hover:text-white">آرنا</button>
            <button onclick="navigate('profile')" class="text-sm text-slate-300 hover:text-white">پنل کاربری</button>
            <button onclick="logout()" class="text-slate-400 hover:text-red-400 p-2"><i data-lucide="log-out" class="w-5 h-5"></i></button>
        </div>
    </nav>

    <div id="section-home">
        <div class="text-center mb-10">
            <h1 class="text-3xl sm:text-4xl font-bold mb-2">آرنا مسابقات</h1>
            <p class="text-slate-400">یک بازی انتخاب کن، حریف پیدا کن و ELO خود را بالا ببر!</p>
        </div>
        <div class="mb-8 flex flex-col sm:flex-row gap-4 items-center justify-center glass p-4 rounded-xl">
            <label class="text-sm text-slate-400">حالت رقابت:</label>
            <select id="team-size" class="w-full sm:w-40">
                <option value="1">۱ نفره (1v1)</option>
                <option value="2">۲ نفره (2v2)</option>
                <option value="3">۳ نفره (3v3)</option>
                <option value="4">۴ نفره (4v4)</option>
            </select>
        </div>
        <div id="games-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
    </div>

    <div id="section-profile" class="hidden">
        <div class="glass p-6 rounded-2xl mb-6">
            <div class="flex flex-col sm:flex-row items-center gap-6 mb-6">
                <div class="w-24 h-24 rounded-2xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-4xl font-bold" id="p-avatar">N</div>
                <div class="flex-1 text-center sm:text-right">
                    <h2 id="p-username" class="text-2xl font-bold mb-1">کاربر</h2>
                    <div class="flex items-center gap-3 justify-center sm:justify-start">
                        <span id="p-rank-badge" class="px-3 py-1 rounded-full text-xs font-bold bg-slate-800">رتبه: -</span>
                        <span class="text-amber-400 font-bold"><span id="p-elo">1000</span> ELO</span>
                    </div>
                    <div class="mt-3 w-full bg-slate-700 rounded-full h-2.5">
                        <div id="p-elo-bar" class="bg-gradient-to-l from-indigo-500 to-purple-500 h-2.5 rounded-full transition-all duration-500" style="width:0%"></div>
                    </div>
                </div>
            </div>
            <div class="grid grid-cols-3 gap-4 text-center mb-6">
                <div class="bg-slate-800/50 p-4 rounded-xl">
                    <div class="text-2xl font-bold text-emerald-400" id="p-wins">0</div>
                    <div class="text-xs text-slate-400 mt-1">برد</div>
                </div>
                <div class="bg-slate-800/50 p-4 rounded-xl">
                    <div class="text-2xl font-bold text-rose-400" id="p-losses">0</div>
                    <div class="text-xs text-slate-400 mt-1">باخت</div>
                </div>
                <div class="bg-slate-800/50 p-4 rounded-xl">
                    <div class="text-2xl font-bold text-amber-400" id="p-winrate">0%</div>
                    <div class="text-xs text-slate-400 mt-1">نرخ برد</div>
                </div>
            </div>
        </div>
        <div class="grid lg:grid-cols-2 gap-6">
            <div class="glass p-6 rounded-2xl">
                <h3 class="font-bold mb-4 flex items-center gap-2"><i data-lucide="history" class="w-5 h-5 text-indigo-400"></i> تاریخچه بازی‌ها</h3>
                <div id="p-history" class="space-y-2 max-h-96 overflow-y-auto pr-2"></div>
            </div>
            <div class="glass p-6 rounded-2xl">
                <h3 class="font-bold mb-4 flex items-center gap-2"><i data-lucide="award" class="w-5 h-5 text-amber-400"></i> دستاوردها</h3>
                <div id="p-achievements" class="grid grid-cols-3 gap-3"></div>
            </div>
        </div>
    </div>
</div>

<script>
let currentUser = null;
let dbData = { users: [], lobbies: [], matches: [] };
let pollingInterval = null;
let currentMatchId = null;

const GAMES = [
    { id: 'math_battle', name: 'نبرد ریاضی', icon: 'calculator', playable: true, desc: 'جمع اعداد رو سریع حساب کن (هدف: ۳۰ امتیاز)' },
    { id: 'tictactoe', name: 'دوز بازی', icon: 'grid-3x3', playable: true, desc: 'نوبتی ۳ خانه رو در صف بچین' },
    { id: 'typing', name: 'تایپ سریع', icon: 'keyboard', playable: true, desc: 'متن رو سریع و بدون غلط تایپ کن' },
    { id: 'reaction', name: 'زمان واکنش', icon: 'zap', playable: true, desc: 'وقتی دکمه سبز شد، سریع کلیک کن' },
    { id: 'trivia', name: 'دانستنی‌ها', icon: 'help-circle', playable: true, desc: 'به سوالات عمومی سریع جواب بده' },
    { id: 'memory', name: 'حافظه تصویری', icon: 'image', playable: false, desc: 'به زودی...' },
    { id: 'chess', name: 'شطرنج سریع', icon: 'crown', playable: false, desc: 'به زودی...' },
    { id: 'connect4', name: 'چهار در صف', icon: 'circle', playable: false, desc: 'به زودی...' },
    { id: 'checkers', name: 'دامه', icon: 'square', playable: false, desc: 'به زودی...' },
    { id: 'sudoku', name: 'سودوکو', icon: 'layout-grid', playable: false, desc: 'به زودی...' },
    { id: 'crossword', name: 'جدول کلمات', icon: 'book-open', playable: false, desc: 'به زودی...' },
    { id: 'wordhunt', name: 'شکار کلمات', icon: 'search', playable: false, desc: 'به زودی...' },
    { id: 'anagram', name: 'جایگذاری حروف', icon: 'shuffle', playable: false, desc: 'به زودی...' },
    { id: 'geography', name: 'جغرافیا', icon: 'globe', playable: false, desc: 'به زودی...' },
    { id: 'flag_quiz', name: 'پرچم‌ها', icon: 'flag', playable: false, desc: 'به زودی...' },
    { id: 'logic_puzzle', name: 'معمای منطق', icon: 'puzzle', playable: false, desc: 'به زودی...' },
    { id: 'riddles', name: 'چیستان', icon: 'meh', playable: false, desc: 'به زودی...' },
    { id: 'color_match', name: 'تطبیق رنگ', icon: 'palette', playable: false, desc: 'به زودی...' },
    { id: 'pattern', name: 'الگوی تصویری', icon: 'pattern', playable: false, desc: 'به زودی...' },
    { id: 'odd_one_out', name: 'پیدا کن متفاوت را', icon: 'eye', playable: false, desc: 'به زودی...' },
    { id: 'math_sequence', name: 'دنباله اعداد', icon: 'list-ordered', playable: false, desc: 'به زودی...' },
    { id: 'word_scramble', name: 'کلمات درهم', icon: 'git-pull-request', playable: false, desc: 'به زودی...' },
    { id: 'morse_code', name: 'کد مورس', icon: 'radio', playable: false, desc: 'به زودی...' },
    { id: 'binary', name: 'باینری', icon: 'binary', playable: false, desc: 'به زودی...' },
    { id: 'maze', name: 'هزارتو', icon: 'route', playable: false, desc: 'به زودی...' },
    { id: 'sliding_puzzle', name: 'پازل متحرک', icon: 'move', playable: false, desc: 'به زودی...' },
    { id: 'hangman', name: 'دار کشی', icon: 'gamepad-2', playable: false, desc: 'به زودی...' },
    { id: 'wordle', name: 'وردل', icon: 'type', playable: false, desc: 'به زودی...' },
    { id: '2048', name: '۲۰۴۸', icon: 'grid', playable: false, desc: 'به زودی...' },
    { id: 'minesweeper', name: 'مین‌یاب', icon: 'bomb', playable: false, desc: 'به زودی...' },
    { id: 'sokoban', name: 'انباری', icon: 'box', playable: false, desc: 'به زودی...' },
    { id: 'tetris', name: 'تتریس', icon: 'blocks', playable: false, desc: 'به زودی...' },
    { id: 'snake', name: 'مار', icon: 'wind', playable: false, desc: 'به زودی...' },
    { id: 'pong', name: 'پینگ پنگ', icon: 'circle-dot', playable: false, desc: 'به زودی...' },
    { id: 'breakout', name: 'آجرشکن', icon: 'square-stack', playable: false, desc: 'به زودی...' },
    { id: 'aim_trainer', name: 'هدف‌گیری', icon: 'target', playable: false, desc: 'به زودی...' },
    { id: 'stroop', name: 'تست استروپ', icon: 'paintbrush', playable: false, desc: 'به زودی...' },
    { id: 'schulte', name: 'جدول شولته', icon: 'table', playable: false, desc: 'به زودی...' },
    { id: 'simon', name: 'بازی سیمون', icon: 'music', playable: false, desc: 'به زودی...' },
    { id: 'chess_puzzle', name: 'معمای شطرنج', icon: 'king', playable: false, desc: 'به زودی...' }
];

function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.remove('hidden'); setTimeout(() => t.classList.add('hidden'), 3000); }
function showAuthModal() { document.getElementById('auth-modal').style.display = 'flex'; }
function hideAuthModal() { document.getElementById('auth-modal').style.display = 'none'; }

async function doAuth() {
    const u = document.getElementById('auth-username').value.trim();
    const p = document.getElementById('auth-password').value;
    if(!u || !p) return showToast('نام و رمز را وارد کنید');
    
    await fetchDb();
    let user = dbData.users.find(x => x.username === u);
    if(!user) {
        user = { username: u, password: p, elo: 1000, wins: 0, losses: 0, history: [] };
        dbData.users.push(user);
        await saveDb();
    } else if(user.password !== p) {
        return showToast('رمز اشتباه است');
    }
    currentUser = u;
    hideAuthModal();
    document.getElementById('app').style.display = 'block';
    initApp();
}

async function fetchDb() {
    try {
        const res = await fetch('/api/db');
        if(!res.ok) throw new Error('Server error');
        dbData = await res.json();
        if(!dbData.users) dbData.users = [];
        if(!dbData.lobbies) dbData.lobbies = [];
        if(!dbData.matches) dbData.matches = [];
    } catch (e) {
        console.error('Fetch DB Error:', e);
    }
}

async function saveDb() {
    try {
        await fetch('/api/db', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(dbData) });
    } catch (e) {
        console.error('Save DB Error:', e);
    }
}

function logout() { currentUser = null; document.getElementById('app').style.display = 'none'; showAuthModal(); }

function initApp() {
    updateNav();
    navigate('home');
    lucide.createIcons();
}

function navigate(section) {
    document.getElementById('section-home').classList.toggle('hidden', section !== 'home');
    document.getElementById('section-profile').classList.toggle('hidden', section !== 'profile');
    if(section === 'home') renderGames();
    if(section === 'profile') renderProfile();
    lucide.createIcons();
}

function getRankInfo(elo) {
    if(elo < 1100) return { name: 'برونز', class: 'rank-bronze', min: 1000, max: 1100 };
    if(elo < 1300) return { name: 'نقره‌ای', class: 'rank-silver', min: 1100, max: 1300 };
    if(elo < 1600) return { name: 'طلایی', class: 'rank-gold', min: 1300, max: 1600 };
    return { name: 'الماس', class: 'rank-diamond', min: 1600, max: 2000 };
}

function updateNav() {
    const user = dbData.users.find(u => u.username === currentUser);
    if(user) document.getElementById('nav-elo').textContent = user.elo || 1000;
}

function renderGames() {
    const html = GAMES.map(g => `
        <div class="game-card glass p-4 rounded-xl flex flex-col items-center text-center cursor-pointer relative ${!g.playable ? 'opacity-40 pointer-events-none' : ''}" onclick="findMatch('${g.id}')">
            ${!g.playable ? '<span class="absolute top-2 left-2 text-[9px] bg-slate-700 px-2 py-0.5 rounded-full">به زودی</span>' : ''}
            <div class="w-12 h-12 rounded-xl bg-indigo-500/10 flex items-center justify-center mb-3">
                <i data-lucide="${g.icon}" class="w-6 h-6 text-indigo-400"></i>
            </div>
            <div class="font-bold text-sm mb-1">${g.name}</div>
            <div class="text-[10px] text-slate-400">${g.desc}</div>
        </div>
    `).join('');
    document.getElementById('games-grid').innerHTML = html;
    lucide.createIcons();
}

async function findMatch(gameId) {
    const teamSize = document.getElementById('team-size').value;
    document.getElementById('lobby-modal').style.display = 'flex';
    document.getElementById('lobby-info').textContent = `بازی: ${GAMES.find(g=>g.id===gameId).name} | حالت: ${teamSize}vs${teamSize}`;
    
    const res = await fetch('/api/matchmaking', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ username: currentUser, gameType: gameId, teamSize: parseInt(teamSize) })
    });
    const data = await res.json();
    
    if(data.status === 'waiting') {
        pollingInterval = setInterval(async () => {
            await fetchDb();
            let match = dbData.matches.find(m => m.players.includes(currentUser));
            if(match) {
                clearInterval(pollingInterval);
                startMatch(match);
            }
        }, 2000);
    } else if(data.status === 'in_match') {
        startMatch(data.match);
    }
}

async function cancelMatchmaking() {
    clearInterval(pollingInterval);
    await fetchDb();
    dbData.lobbies = dbData.lobbies.filter(l => !l.players.includes(currentUser));
    await saveDb();
    document.getElementById('lobby-modal').style.display = 'none';
    showToast('جستجو لغو شد');
}

async function startMatch(match) {
    currentMatchId = match.id;
    document.getElementById('lobby-modal').style.display = 'none';
    document.getElementById('match-modal').style.display = 'flex';
    document.getElementById('m-title').textContent = GAMES.find(g=>g.id===match.gameType).name;
    document.getElementById('m-subtitle').textContent = GAMES.find(g=>g.id===match.gameType).desc;
    
    renderMatchUI(match);
    
    // Polling for opponent moves (reduced to 1.5s for better sync)
    pollingInterval = setInterval(async () => {
        await fetchDb();
        let m = dbData.matches.find(x => x.id === currentMatchId);
        if(m) renderMatchUI(m);
        else endMatch();
    }, 1500);
}

async function renderMatchUI(match) {
    const userScore = match.state.scores[currentUser] || 0;
    const enemy = match.players.find(p => p !== currentUser);
    const enemyScore = match.state.scores[enemy] || 0;
    
    document.getElementById('m-score').textContent = userScore;
    document.getElementById('m-enemy-score').textContent = enemyScore;
    
    const content = document.getElementById('m-content');
    
    if(match.state.winner) {
        clearInterval(pollingInterval);
        const isWin = match.state.winner === currentUser;
        const isDraw = match.state.winner === 'draw';
        
        if(!match.finished) {
            await fetch('/api/match/finish', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ matchId: match.id }) });
            await fetchDb();
            updateNav();
        }
        
        content.innerHTML = `<div class="text-center py-8">
            <i data-lucide="${isDraw ? 'meh' : (isWin ? 'smile' : 'frown')}" class="w-20 h-20 mx-auto mb-4 ${isDraw ? 'text-slate-400' : (isWin ? 'text-emerald-400' : 'text-rose-400')}"></i>
            <h3 class="text-2xl font-bold mb-2">${isDraw ? 'مساوی شد!' : (isWin ? 'شما برنده شدید! (+15 ELO)' : 'شما باختید! (-10 ELO)')}</h3>
            <button onclick="endMatch()" class="btn-brand px-6 py-2 rounded-lg mt-4">بستن و بازگشت</button>
        </div>`;
        lucide.createIcons();
        return;
    }
    
    if(match.gameType === 'math_battle') {
        if(match.state.turn === currentUser) {
            content.innerHTML = `<p class="mb-4 text-lg text-emerald-400 font-bold">نوبت شماست!</p>
            <div dir="ltr" class="text-5xl font-bold text-indigo-400 mb-6 bg-slate-800/50 px-8 py-4 rounded-xl">${match.state.data.question} = ?</div>
            <input type="number" id="math-answer" placeholder="جواب" class="w-32 text-center text-2xl font-bold mb-4" onkeydown="if(event.key==='Enter')submitMath()">
            <button onclick="submitMath()" class="btn-brand px-6 py-2 rounded-lg font-bold">ارسال</button>`;
            document.getElementById('math-answer').focus();
        } else {
            content.innerHTML = `<p class="text-slate-400 text-lg">حریف در حال پاسخگویی است...</p><div class="animate-spin mt-4"><i data-lucide="loader-2"></i></div>`;
        }
    } else if(match.gameType === 'tictactoe') {
        const mySymbol = match.state.symbols[currentUser];
        const isMyTurn = match.state.turn === currentUser;
        content.innerHTML = `
            <p class="mb-4 text-sm ${isMyTurn ? 'text-emerald-400' : 'text-slate-400'}">شما (<b>${mySymbol}</b>) | ${isMyTurn ? 'نوبت شماست' : 'نوبت حریف'}</p>
            <div class="grid grid-cols-3 gap-2 w-64">
                ${match.state.data.board.map((cell, i) => `
                    <div onclick="${isMyTurn ? `placeTTT(${i})` : ''}" class="ttt-cell h-20 bg-slate-800 rounded-lg flex items-center justify-center text-4xl font-bold ${cell === 'X' ? 'text-emerald-400' : 'text-rose-400'} cursor-pointer">
                        ${cell}
                    </div>
                `).join('')}
            </div>`;
    } else if(match.gameType === 'typing') {
        content.innerHTML = `<p class="mb-4 text-sm text-slate-400">متن زیر را سریع و دقیق تایپ کنید:</p>
        <div dir="ltr" class="bg-slate-800 p-4 rounded-lg mb-4 text-lg font-bold text-amber-400">${match.state.data.targetText}</div>
        <input type="text" id="typing-input" placeholder="اینجا تایپ کنید..." class="w-full max-w-md mb-4 text-center" autofocus>
        <button onclick="submitTyping()" class="btn-brand px-6 py-2 rounded-lg font-bold">اتمام تایپ</button>`;
        document.getElementById('typing-input').focus();
    } else if(match.gameType === 'reaction') {
        if(!match.state.startTime) {
            if(match.state.turn === currentUser) {
                fetch('/api/match/action', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ username: currentUser, matchId: currentMatchId, action: 'init' }) });
            }
            content.innerHTML = `<div class="w-32 h-32 rounded-full bg-amber-500 flex items-center justify-center text-white font-bold text-xl">آماده باش...</div>`;
        } else {
            const remaining = match.state.startTime - Date.now();
            if(remaining > 0) {
                content.innerHTML = `<div class="w-32 h-32 rounded-full bg-amber-500 flex items-center justify-center text-white font-bold text-xl">آماده باش...</div>`;
            } else {
                content.innerHTML = `<p class="text-emerald-400 font-bold mb-4 text-xl">الان!</p>
                <button onclick="reactionClick()" class="bg-emerald-600 px-10 py-5 rounded-xl font-bold text-lg pulse-ring">کلیک کن!</button>`;
            }
        }
    } else if(match.gameType === 'trivia') {
        if(match.state.turn === currentUser) {
            content.innerHTML = `<p class="mb-4 text-lg text-emerald-400 font-bold">سوال عمومی:</p>
            <div class="text-xl font-bold text-indigo-400 mb-6 bg-slate-800/50 px-8 py-4 rounded-xl">${match.state.data.question}</div>
            <div class="grid grid-cols-2 gap-3 w-full max-w-md">
                ${match.state.data.options.map((opt, i) => `
                    <button onclick="submitTrivia(${i})" class="bg-slate-800 hover:bg-indigo-600 transition px-4 py-3 rounded-lg font-medium border border-slate-700">${opt}</button>
                `).join('')}
            </div>`;
        } else {
            content.innerHTML = `<p class="text-slate-400 text-lg">حریف در حال پاسخگویی است...</p><div class="animate-spin mt-4"><i data-lucide="loader-2"></i></div>`;
        }
    }
    lucide.createIcons();
}

// --- Actions with Optimistic UI ---
async function submitMath() {
    const val = parseInt(document.getElementById('math-answer').value);
    if(isNaN(val)) return;
    
    // Optimistic Update
    const match = dbData.matches.find(m => m.id === currentMatchId);
    if(match) {
        match.state.turn = match.players.find(p => p !== currentUser);
        renderMatchUI(match);
    }
    
    await fetch('/api/match/action', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ username: currentUser, matchId: currentMatchId, action: 'answer', value: val }) });
}

async function placeTTT(index) {
    const match = dbData.matches.find(m => m.id === currentMatchId);
    if(match && match.state.turn === currentUser && match.state.data.board[index] === "") {
        // Optimistic Update
        match.state.data.board[index] = match.state.symbols[currentUser];
        match.state.turn = match.players.find(p => p !== currentUser);
        renderMatchUI(match);
        
        await fetch('/api/match/action', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ username: currentUser, matchId: currentMatchId, action: 'place', value: index }) });
    }
}

async function submitTyping() {
    const val = document.getElementById('typing-input').value;
    const match = dbData.matches.find(m => m.id === currentMatchId);
    if(match) {
        match.state.turn = match.players.find(p => p !== currentUser);
        renderMatchUI(match);
    }
    await fetch('/api/match/action', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ username: currentUser, matchId: currentMatchId, action: 'finish', value: val }) });
}

async function reactionClick() {
    const match = dbData.matches.find(m => m.id === currentMatchId);
    if(match) {
        match.state.winner = currentUser;
        renderMatchUI(match);
    }
    await fetch('/api/match/action', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ username: currentUser, matchId: currentMatchId, action: 'click' }) });
}

async function submitTrivia(optionIndex) {
    const match = dbData.matches.find(m => m.id === currentMatchId);
    if(match) {
        match.state.turn = match.players.find(p => p !== currentUser);
        renderMatchUI(match);
    }
    await fetch('/api/match/action', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ username: currentUser, matchId: currentMatchId, action: 'answer_trivia', value: optionIndex }) });
}

async function endMatch() {
    clearInterval(pollingInterval);
    currentMatchId = null;
    document.getElementById('match-modal').style.display = 'none';
    navigate('home');
}

async function leaveMatch() {
    await fetch('/api/match/action', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ username: currentUser, matchId: currentMatchId, action: 'surrender' }) });
    endMatch();
}

function renderProfile() {
    const user = dbData.users.find(u => u.username === currentUser);
    if(!user) return;
    
    const elo = user.elo || 1000;
    const wins = user.wins || 0;
    const losses = user.losses || 0;
    const totalGames = wins + losses;
    const winrate = totalGames > 0 ? Math.round((wins / totalGames) * 100) : 0;
    
    document.getElementById('p-avatar').textContent = currentUser.charAt(0).toUpperCase();
    document.getElementById('p-username').textContent = currentUser;
    document.getElementById('p-elo').textContent = elo;
    document.getElementById('p-wins').textContent = wins;
    document.getElementById('p-losses').textContent = losses;
    document.getElementById('p-winrate').textContent = winrate + '%';
    
    const rankInfo = getRankInfo(elo);
    const rankBadge = document.getElementById('p-rank-badge');
    rankBadge.className = `px-3 py-1 rounded-full text-xs font-bold bg-slate-800 ${rankInfo.class}`;
    rankBadge.textContent = `رتبه: ${rankInfo.name}`;
    
    const eloPct = ((elo - rankInfo.min) / (rankInfo.max - rankInfo.min)) * 100;
    document.getElementById('p-elo-bar').style.width = Math.min(100, eloPct) + '%';
    
    const historyHtml = (user.history || []).slice().reverse().map(h => {
        const gameName = GAMES.find(g => g.id === h.game)?.name || h.game;
        return `<div class="bg-slate-800/50 p-3 rounded-lg flex justify-between items-center">
            <span class="text-sm font-medium">${gameName}</span>
            <span class="text-xs font-bold px-2 py-1 rounded ${h.result === 'win' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-rose-500/20 text-rose-400'}">${h.result === 'win' ? 'برد' : 'باخت'}</span>
        </div>`;
    }).join('') || '<p class="text-slate-400 text-center py-4">سابقه بازی وجود ندارد</p>';
    document.getElementById('p-history').innerHTML = historyHtml;
    
    const achievements = [
        { icon: 'baby', name: 'اولین قدم', unlocked: totalGames >= 1 },
        { icon: 'star', name: 'تک ستاره', unlocked: wins >= 1 },
        { icon: 'flame', name: 'برنده ۵ پیاپی', unlocked: false },
        { icon: 'sword', name: 'جنگجو', unlocked: totalGames >= 10 },
        { icon: 'gem', name: 'الماس', unlocked: elo >= 1600 },
        { icon: 'crown', name: 'قهرمان', unlocked: elo >= 2000 }
    ];
    document.getElementById('p-achievements').innerHTML = achievements.map(a => `
        <div class="bg-slate-800/50 p-3 rounded-xl text-center ${a.unlocked ? '' : 'opacity-30'}">
            <i data-lucide="${a.icon}" class="w-6 h-6 mx-auto mb-1 ${a.unlocked ? 'text-amber-400' : 'text-slate-500'}"></i>
            <div class="text-[10px] font-medium">${a.name}</div>
        </div>
    `).join('');
    
    lucide.createIcons();
}

window.onload = async function() {
    lucide.createIcons();
    try {
        await fetchDb();
    } catch (e) {
        console.error("Initial DB fetch failed");
    }
};
</script>
